name: CI2

on:
  push:
    branches:
      - iceraven
  workflow_dispatch:

jobs:
  build-specific:
    name: Build forkRelease arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Create version name
        run: |
          VERSION=$(git describe --tags HEAD 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Cache Android SDK
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: /usr/local/lib/android/sdk
          key: android-sdk-${{ hashFiles('automation/iceraven/install-sdk.sh') }}

      - name: Install Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          if [ "${{ steps.sdk-cache.outputs.cache-hit }}" != "true" ]; then
            ./automation/iceraven/install-sdk.sh
          else
            echo "✅ SDK restored from cache"
          fi

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias iceraven \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iceravenpass \
            -keypass iceravenpass \
            -dname "CN=Iceraven, OU=Build, O=Personal, L=PH, S=PH, C=PH"

      - name: Patch build.gradle for signing and arm64-only
        run: |
          python3 << 'PYEOF'
          with open('app/build.gradle', 'r') as f:
              content = f.read()

          # Inject signingConfigs block before buildTypes
          signing_block = '''    signingConfigs {
              ciSign {
                  storeFile file(System.getenv("GITHUB_WORKSPACE") + "/release.keystore")
                  storePassword "iceravenpass"
                  keyAlias "iceraven"
                  keyPassword "iceravenpass"
              }
          }
          '''
          content = content.replace('    buildTypes {', signing_block + '    buildTypes {', 1)

          # Wire signingConfig into forkRelease
          content = content.replace(
              'forkRelease releaseTemplate >> {',
              'forkRelease releaseTemplate >> {\n            signingConfig signingConfigs.ciSign'
          )

          # Restrict ABI splits to arm64 only
          content = content.replace(
              'include "armeabi-v7a", "arm64-v8a", "x86_64"',
              'include "arm64-v8a"'
          )

          with open('app/build.gradle', 'w') as f:
              f.write(content)
          print("✅ Patched build.gradle")
          PYEOF

      - name: Patch strings
        run: |
          ./automation/iceraven/patch_android_components.sh
          sed -i 's/Firefox/Iceraven/g' app/src/main/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/main/res/values*/*strings.xml

      - name: Build forkRelease arm64-v8a
        run: |
          ./gradlew app:assembleForkRelease \
            -PversionName=${{ env.VERSION_NAME }} \
            --no-daemon

      - name: Find and verify APK
        run: |
          APK=$(find . -path "*/outputs/apk/forkRelease/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK in outputs! All APKs found:"
            find . -name "*.apk" | while read f; do echo "  $f"; done
            exit 1
          fi
          echo "📦 Found: $APK"
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner
          $APKSIGNER verify --verbose "$APK" \
            && echo "✅ APK verified" \
            || (echo "❌ Verification failed!" && exit 1)

      - name: Copy APK to output
        run: |
          APK=$(find . -path "*/outputs/apk/forkRelease/*.apk" | head -1)
          mkdir -p output
          cp "$APK" "output/${{ env.VERSION_NAME }}-arm64-forkRelease.apk"
          echo "✅ $(du -h output/*.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION_NAME }}-arm64-forkRelease
          path: output/*.apk
