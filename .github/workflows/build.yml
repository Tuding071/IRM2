name: CI2

on:
  push:
    branches:
      - iceraven
  workflow_dispatch:

jobs:
  build-specific:
    name: Build forkRelease arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Create version name
        run: |
          VERSION=$(git describe --tags HEAD 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          ./automation/iceraven/install-sdk.sh

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore app/release.keystore \
            -alias iceraven \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iceravenpass \
            -keypass iceravenpass \
            -dname "CN=Iceraven, OU=Build, O=Personal, L=PH, S=PH, C=PH"

      - name: Patch strings
        run: |
          ./automation/iceraven/patch_android_components.sh
          sed -i 's/Firefox/Iceraven/g' app/src/main/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/main/res/values*/*strings.xml

      - name: Build forkRelease arm64-v8a only
        run: |
          ./gradlew app:assembleForkRelease \
            -PversionName=${{ env.VERSION_NAME }} \
            -PautoSignRelease=true \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
            -Pandroid.injected.signing.store.password=iceravenpass \
            -Pandroid.injected.signing.key.alias=iceraven \
            -Pandroid.injected.signing.key.password=iceravenpass \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon

      - name: Verify APK signed
        run: |
          APK=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -1)
          echo "🔍 Verifying: $APK"
          $APKSIGNER verify --verbose "$APK" && echo "✅ APK is properly signed" || (echo "❌ APK is NOT signed!" && exit 1)

      - name: Copy APK to output
        run: |
          APK=$(find . -name "*.apk" -type f | head -1)
          mkdir -p output
          cp "$APK" "output/${{ env.VERSION_NAME }}-arm64-forkRelease.apk"
          echo "✅ $(du -h output/*.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION_NAME }}-arm64-forkRelease
          path: output/*.apk
