name: CI2

on:
  push:
    branches:
      - iceraven
  workflow_dispatch:

jobs:
  build-specific:
    name: Build forkRelease arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Create version name
        run: |
          VERSION=$(git describe --tags HEAD 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          ./automation/iceraven/install-sdk.sh

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore ${{ github.workspace }}/release.keystore \
            -alias iceraven \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass iceravenpass \
            -keypass iceravenpass \
            -dname "CN=Iceraven, OU=Build, O=Personal, L=PH, S=PH, C=PH"

      - name: Patch strings
        run: |
          ./automation/iceraven/patch_android_components.sh
          sed -i 's/Firefox/Iceraven/g' app/src/main/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/main/res/values*/*strings.xml

      - name: Build forkRelease arm64-v8a (unsigned)
        run: |
          ./gradlew app:assembleForkRelease \
            -PversionName=${{ env.VERSION_NAME }} \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon

      - name: Sign APK manually
        run: |
          UNSIGNED=$(find . -path "*/forkRelease/*.apk" -not -name "*signed*" | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "❌ No unsigned APK found!"
            find . -name "*.apk" | while read f; do echo "  $f"; done
            exit 1
          fi
          echo "📦 Found: $UNSIGNED"

          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          ZIPALIGN=$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner

          ALIGNED=${{ github.workspace }}/aligned.apk
          SIGNED=${{ github.workspace }}/signed.apk

          $ZIPALIGN -v -p 4 "$UNSIGNED" "$ALIGNED"
          $APKSIGNER sign \
            --ks ${{ github.workspace }}/release.keystore \
            --ks-key-alias iceraven \
            --ks-pass pass:iceravenpass \
            --key-pass pass:iceravenpass \
            --out "$SIGNED" \
            "$ALIGNED"

          echo "✅ Signed APK ready"

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APKSIGNER=$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner
          $APKSIGNER verify --verbose ${{ github.workspace }}/signed.apk \
            && echo "✅ Verification passed" \
            || (echo "❌ Verification failed!" && exit 1)

      - name: Copy APK to output
        run: |
          mkdir -p output
          cp ${{ github.workspace }}/signed.apk "output/${{ env.VERSION_NAME }}-arm64-forkRelease.apk"
          echo "✅ $(du -h output/*.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION_NAME }}-arm64-forkRelease
          path: output/*.apk
