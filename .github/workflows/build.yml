name: Build Iceraven

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set SDK path
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Install SDK extras
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch components
        run: ./automation/iceraven/patch_android_components.sh

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew app:assembleForkRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iceraven
          path: app/build/outputs/apk/
