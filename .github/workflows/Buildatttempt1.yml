name: CI

on:
  push:
    branches:
      - iceraven
  workflow_dispatch:

jobs:
  build-specific:
    name: Build forkRelease arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD)" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          ./automation/iceraven/install-sdk.sh

      - name: Generate dummy keystore
        run: |
          keytool -genkey -v \
            -keystore app/dummy.keystore \
            -alias dummy \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password \
            -keypass password \
            -dname "CN=Dummy, OU=Iceraven, O=Iceraven, L=Test, S=Test, C=US"

      - name: Patch strings
        run: |
          ./automation/iceraven/patch_android_components.sh
          sed -i 's/Firefox/Iceraven/g' app/src/main/res/values*/*strings.xml
          sed -i '/about_content/s/Mozilla/@forkmaintainers/' app/src/main/res/values*/*strings.xml

      - name: Build ONLY forkRelease
        run: |
          ./gradlew app:assembleForkRelease \
            -PversionName=${{ env.VERSION_NAME }} \
            -PautoSignRelease=true \
            --no-daemon

      - name: Find and debug APK
        run: |
          echo "📂 Scanning for APKs..."
          find app/build/outputs/apk/ -name "*.apk" -type f | while read apk; do
            echo "  📦 Found: $apk ($(ls -lh "$apk" | awk '{print $5}'))"
          done
          
          echo ""
          echo "🔍 Looking specifically for arm64 APK..."
          ARM64_APK=$(find app/build/outputs/apk/ -name "*arm64-v8a*" -type f | head -1)
          
          if [ -n "$ARM64_APK" ]; then
            echo "✅ Found arm64 APK: $ARM64_APK"
            mkdir -p output
            cp "$ARM64_APK" "output/${VERSION_NAME}-arm64-forkRelease.apk"
            echo "📋 Copied to: output/${VERSION_NAME}-arm64-forkRelease.apk"
            echo "📊 Size: $(ls -lh output/${VERSION_NAME}-arm64-forkRelease.apk | awk '{print $5}')"
          else
            echo "❌ No arm64 APK found!"
            echo ""
            echo "📂 All files in output directory:"
            find app/build/outputs/ -type f | head -20
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          path: output/*.apk
          name: ${{ env.VERSION_NAME }}-arm64-forkRelease
